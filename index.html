<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Contacts</title>
    <style>
        /* Basic Reset & Font */
        :root {
            --color-indigo-600: #4f46e5;
            --color-indigo-700: #4338ca;
            --color-indigo-500: #6366f1;
            --color-indigo-800: #3730a3;
            --color-indigo-200: #c7d2fe;
            --color-indigo-50: #eef2ff;
            --color-red-600: #dc2626;
            --color-red-700: #b91c1c;
            --color-gray-100: #f3f4f6;
            --color-gray-200: #e5e7eb;
            --color-gray-300: #d1d5db;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--color-gray-100);
            color: var(--color-gray-800);
        }

        /* Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 33.33%;
            max-width: 320px;
            background-color: white;
            border-right: 1px solid var(--color-gray-200);
            overflow-y: auto;
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Header */
        .header {
            background-color: white;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header .logo {
            display: flex;
            align-items: center;
        }

        .header .logo h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 0 0.75rem;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid var(--color-gray-300);
            border-radius: 9999px;
            width: 256px;
            transition: all 0.2s;
        }
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--color-indigo-500);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-gray-400);
        }

        .add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background-color: var(--color-indigo-600);
            color: white;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-btn:hover {
            background-color: var(--color-indigo-700);
        }

        /* Contact List */
        .contact-list {
            padding: 0.5rem 0;
            list-style: none;
            margin: 0;
        }
        .contact-list-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            border-left: 4px solid transparent;
        }
        .contact-list-item:hover {
            background-color: var(--color-gray-100);
        }
        .contact-list-item.selected {
            background-color: var(--color-indigo-50);
            border-left-color: var(--color-indigo-500);
        }
        .contact-list-item .info {
            margin-left: 1rem;
        }
        .contact-list-item .name {
            font-weight: 600;
        }
        .contact-list-item.selected .name {
            color: var(--color-indigo-800);
        }
        .contact-list-item .email {
            font-size: 0.875rem;
            color: var(--color-gray-500);
        }
         .contact-list-item.selected .email {
            color: var(--color-indigo-600);
        }

        /* Avatar */
        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: white;
            font-weight: bold;
        }

        /* Contact Details & Form */
        .card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            padding: 2rem;
            animation: fade-in 0.3s ease-out;
        }
        
        .details-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .details-container h2 {
            font-size: 1.875rem;
            font-weight: bold;
            margin-top: 1.5rem;
        }
        .details-info-section {
            width: 100%;
            margin-top: 2rem;
            border-top: 1px solid var(--color-gray-200);
            padding-top: 1.5rem;
        }
        .details-info-item {
            display: flex;
            align-items: center;
            color: var(--color-gray-700);
            margin-bottom: 1rem;
        }
        .details-info-item svg {
            margin-right: 1rem;
            color: var(--color-indigo-500);
        }
        .details-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Form */
        .form-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .form-field {
            margin-bottom: 1.5rem;
        }
        .form-field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-gray-700);
            margin-bottom: 0.25rem;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-gray-300);
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        .form-input:focus {
             outline: none;
             box-shadow: 0 0 0 2px var(--color-indigo-500);
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding-top: 1rem;
        }
        
        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }
        .btn svg {
            margin-right: 0.5rem;
        }
        .btn-primary {
            background-color: var(--color-indigo-600);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--color-indigo-700);
        }
        .btn-danger {
            background-color: var(--color-red-600);
            color: white;
        }
        .btn-danger:hover {
            background-color: var(--color-red-700);
        }
        .btn-secondary {
            background-color: var(--color-gray-200);
            color: var(--color-gray-800);
        }
        .btn-secondary:hover {
            background-color: var(--color-gray-300);
        }

        /* Placeholder */
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--color-gray-500);
        }
        .placeholder svg {
            width: 6rem;
            height: 6rem;
            margin-bottom: 1rem;
            color: var(--color-gray-300);
        }
        .placeholder h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }
        .placeholder p {
            margin-top: 0.5rem;
        }
        .placeholder .btn {
            margin-top: 1.5rem;
        }

        /* Utility & Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-sm { width: 1.25rem; height: 1.25rem; }
        .icon-md { width: 1.5rem; height: 1.5rem; }
        .icon-lg { width: 1.75rem; height: 1.75rem; }

        @media (max-width: 768px) {
            .sidebar {
                width: 40%;
            }
            .content-area {
                padding: 1rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .search-input {
                width: 150px;
            }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>

    <div id="app" class="app-container">
        <header class="header">
            <div class="logo">
                <svg class="icon-lg" style="color: var(--color-indigo-600);" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.282-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.282.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <h1>Contacts</h1>
            </div>
            <div class="actions">
                <div class="search-container">
                     <span class="search-icon">
                        <svg class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Search contacts..." class="search-input" />
                </div>
                <button id="add-new-btn" class="add-btn" aria-label="Add new contact">
                    <svg class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <ul id="contact-list" class="contact-list"></ul>
            </aside>
            <main id="main-content" class="content-area"></main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- STATE ---
            let contacts = [];
            let selectedContactId = null;
            let viewMode = 'view'; // 'view', 'edit', 'add'
            let searchTerm = '';

            const initialContacts = [
                { id: '1', firstName: 'John', lastName: 'Doe', phone: '123-456-7890', email: 'john.doe@example.com' },
                { id: '2', firstName: 'Jane', lastName: 'Smith', phone: '234-567-8901', email: 'jane.smith@example.com' },
                { id: '3', firstName: 'Alice', lastName: 'Johnson', phone: '345-678-9012', email: 'alice.j@example.com' },
                { id: '4', firstName: 'Bob', lastName: 'Williams', phone: '456-789-0123', email: 'bob.w@example.com' },
                { id: '5', firstName: 'Charlie', lastName: 'Brown', phone: '567-890-1234', email: 'charlie.b@example.com' },
            ];

            // --- DOM ELEMENTS ---
            const contactListEl = document.getElementById('contact-list');
            const mainContentEl = document.getElementById('main-content');
            const searchInputEl = document.getElementById('search-input');
            const addNewBtn = document.getElementById('add-new-btn');

            // --- AVATAR HELPERS ---
            const getInitials = (firstName = '', lastName = '') => `${firstName[0] || ''}${lastName[0] || ''}`.toUpperCase();
            
            const generateAvatarColor = (firstName = '', lastName = '') => {
                const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#f43f5e'];
                const charCodeSum = (firstName.charCodeAt(0) || 0) + (lastName.charCodeAt(0) || 0);
                return colors[charCodeSum % colors.length];
            };

            // --- RENDER FUNCTIONS ---
            const renderContactList = () => {
                contactListEl.innerHTML = ''; // Clear existing list
                
                const filteredContacts = contacts.filter(contact =>
                    `${contact.firstName} ${contact.lastName}`.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    contact.phone.includes(searchTerm) ||
                    contact.email.toLowerCase().includes(searchTerm.toLowerCase())
                ).sort((a, b) => a.firstName.localeCompare(b.firstName));

                if (filteredContacts.length === 0) {
                     contactListEl.innerHTML = `<p style="text-align: center; color: var(--color-gray-500); padding: 1rem;">No contacts found.</p>`;
                     return;
                }

                filteredContacts.forEach(contact => {
                    const item = document.createElement('li');
                    item.className = 'contact-list-item';
                    item.dataset.id = contact.id;
                    if (contact.id === selectedContactId) {
                        item.classList.add('selected');
                    }
                    
                    item.innerHTML = `
                        <div class="avatar" style="width: 40px; height: 40px; font-size: 0.875rem; background-color: ${generateAvatarColor(contact.firstName, contact.lastName)};">
                            <span>${getInitials(contact.firstName, contact.lastName)}</span>
                        </div>
                        <div class="info">
                            <p class="name">${contact.firstName} ${contact.lastName}</p>
                            <p class="email">${contact.email}</p>
                        </div>
                    `;
                    contactListEl.appendChild(item);
                });
            };

            const renderMainContent = () => {
                const selectedContact = contacts.find(c => c.id === selectedContactId);

                if (viewMode === 'add') {
                    mainContentEl.innerHTML = getContactFormHTML();
                } else if (viewMode === 'edit' && selectedContact) {
                    mainContentEl.innerHTML = getContactFormHTML(selectedContact);
                } else if (viewMode === 'view' && selectedContact) {
                    mainContentEl.innerHTML = getContactDetailsHTML(selectedContact);
                } else {
                    mainContentEl.innerHTML = getPlaceholderHTML();
                }
                attachMainContentListeners();
            };
            
            const getContactDetailsHTML = (contact) => {
                return `
                    <div class="card details-container">
                        <div class="avatar" style="width: 128px; height: 128px; font-size: 3rem; background-color: ${generateAvatarColor(contact.firstName, contact.lastName)}; border: 4px solid var(--color-indigo-200);">
                            <span>${getInitials(contact.firstName, contact.lastName)}</span>
                        </div>
                        <h2>${contact.firstName} ${contact.lastName}</h2>
                        <div class="details-info-section">
                            <div class="details-info-item">
                                <svg class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                                <span>${contact.phone}</span>
                            </div>
                            <div class="details-info-item">
                                 <svg class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                                <span>${contact.email}</span>
                            </div>
                        </div>
                        <div class="details-actions">
                            <button class="btn btn-primary" id="edit-contact-btn">
                                <svg class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L15.232 5.232z" /></svg>
                                Edit
                            </button>
                            <button class="btn btn-danger" id="delete-contact-btn" data-id="${contact.id}">
                                <svg class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            };

            const getContactFormHTML = (contact = null) => {
                 return `
                    <div class="card">
                        <h2 class="form-title">${contact ? 'Edit Contact' : 'Add New Contact'}</h2>
                        <form id="contact-form" data-id="${contact ? contact.id : ''}">
                            <div class="form-grid">
                                <div class="form-field">
                                    <label for="firstName">First Name</label>
                                    <input type="text" name="firstName" id="firstName" class="form-input" required value="${contact ? contact.firstName : ''}" />
                                </div>
                                 <div class="form-field">
                                    <label for="lastName">Last Name</label>
                                    <input type="text" name="lastName" id="lastName" class="form-input" required value="${contact ? contact.lastName : ''}" />
                                </div>
                            </div>
                            <div class="form-field">
                                <label for="phone">Phone Number</label>
                                <input type="tel" name="phone" id="phone" class="form-input" required value="${contact ? contact.phone : ''}" />
                            </div>
                            <div class="form-field">
                                <label for="email">Email Address</label>
                                <input type="email" name="email" id="email" class="form-input" required value="${contact ? contact.email : ''}" />
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" id="cancel-form-btn">Cancel</button>
                                <button type="submit" class="btn btn-primary">Save Contact</button>
                            </div>
                        </form>
                    </div>
                 `;
            };
            
            const getPlaceholderHTML = () => {
                return `
                    <div class="placeholder">
                         <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21v-1a6 6 0 00-5.176-5.97m5.176 5.97h3.428a2.25 2.25 0 002.12-3.242" />
                        </svg>
                        <h2>No Contact Selected</h2>
                        <p>Select a contact from the list to see their details.</p>
                        <button class="btn btn-primary" id="placeholder-add-btn">
                             <svg class="icon-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            Add New Contact
                        </button>
                    </div>
                `;
            };

            const render = () => {
                renderContactList();
                renderMainContent();
            };

            // --- EVENT HANDLERS ---
            const handleSelectContact = (e) => {
                const target = e.target.closest('.contact-list-item');
                if (target) {
                    selectedContactId = target.dataset.id;
                    viewMode = 'view';
                    render();
                }
            };

            const handleSearch = (e) => {
                searchTerm = e.target.value;
                renderContactList();
            };
            
            const handleAddNew = () => {
                selectedContactId = null;
                viewMode = 'add';
                render();
            };

            const handleEdit = () => {
                viewMode = 'edit';
                render();
            };
            
            const handleDelete = (e) => {
                const contactId = e.target.closest('button').dataset.id;
                const contactToDelete = contacts.find(c => c.id === contactId);
                if (window.confirm(`Are you sure you want to delete ${contactToDelete.firstName} ${contactToDelete.lastName}?`)) {
                    contacts = contacts.filter(c => c.id !== contactId);
                    if (selectedContactId === contactId) {
                        selectedContactId = contacts.length > 0 ? contacts[0].id : null;
                        viewMode = 'view';
                    }
                    render();
                }
            };
            
            const handleCancelForm = () => {
                if(contacts.find(c => c.id === selectedContactId)) {
                    viewMode = 'view';
                } else {
                    selectedContactId = contacts.length > 0 ? contacts[0].id : null;
                    viewMode = 'view';
                }
                render();
            };

            const handleSaveContact = (e) => {
                e.preventDefault();
                const form = e.target;
                const contactId = form.dataset.id;
                const formData = new FormData(form);
                const contactData = {
                    firstName: formData.get('firstName'),
                    lastName: formData.get('lastName'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                };
                
                if (contactId) { // Editing
                    contacts = contacts.map(c => c.id === contactId ? { ...c, ...contactData } : c);
                } else { // Adding
                    const newContact = { ...contactData, id: Date.now().toString() };
                    contacts.push(newContact);
                    selectedContactId = newContact.id;
                }
                viewMode = 'view';
                render();
            };

            // --- ATTACH LISTENERS ---
            function attachMainContentListeners() {
                const editBtn = document.getElementById('edit-contact-btn');
                if(editBtn) editBtn.addEventListener('click', handleEdit);
                
                const deleteBtn = document.getElementById('delete-contact-btn');
                if(deleteBtn) deleteBtn.addEventListener('click', handleDelete);
                
                const contactForm = document.getElementById('contact-form');
                if(contactForm) contactForm.addEventListener('submit', handleSaveContact);
                
                const cancelBtn = document.getElementById('cancel-form-btn');
                if(cancelBtn) cancelBtn.addEventListener('click', handleCancelForm);

                const placeholderAddBtn = document.getElementById('placeholder-add-btn');
                if(placeholderAddBtn) placeholderAddBtn.addEventListener('click', handleAddNew);
            }
            
            contactListEl.addEventListener('click', handleSelectContact);
            searchInputEl.addEventListener('input', handleSearch);
            addNewBtn.addEventListener('click', handleAddNew);
            
            // --- INITIALIZATION ---
            function init() {
                contacts = [...initialContacts];
                if (contacts.length > 0) {
                    selectedContactId = contacts[0].id;
                }
                render();
            }

            init();
        });
    </script>

<script type="module" src="/index.tsx"></script>
</body>
</html>
